name: Doctor Multi-Runner

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doctor-multirunner-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: nightly-2026-06-22
  CARGO_TERM_COLOR: always

jobs:
  rust_doctor:
    name: doctor/rust/${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt,clippy
          rustup override set "${RUST_TOOLCHAIN}"
          rustc --version --verbose
          cargo --version
      - name: Format exact tree
        shell: bash
        run: cargo fmt --all -- --check
      - name: Compile doctor contract
        shell: bash
        run: cargo test --locked --all-features --test doctor_contract -- --nocapture
      - name: Execute Vision 2030 doctor
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --all-features --bin wasm4pm-compat -- doctor vision2030 --json
          cargo run --locked --all-features --bin wasm4pm-compat -- plan discover replay verify-standing --json

  polyglot_doctor:
    name: doctor/polyglot/ubuntu-24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Execute eleven-language conformance rail
        shell: bash
        run: bash scripts/verify-doctor-polyglot.sh
      - name: Execute remaining installed runtime languages
        shell: bash
        run: bash scripts/verify-doctor-polyglot-extra.sh
