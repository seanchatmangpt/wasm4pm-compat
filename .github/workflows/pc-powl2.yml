name: PC-POWL2 Wire

on:
  pull_request:
    branches: [main]
    paths:
      - "src/pc_powl2.rs"
      - "src/prelude.rs"
      - ".github/workflows/pc-powl2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pc-powl2-wire-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-22
          components: rustfmt, clippy
      - name: Manufacture formatting candidate
        id: format
        continue-on-error: true
        run: |
          cargo fmt --all
          git diff --exit-code
      - name: Upload normalized wire receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc-powl2-wire-formatted-sources
          path: |
            src/pc_powl2.rs
            src/prelude.rs
          if-no-files-found: error
      - name: Refuse uncommitted formatting
        if: steps.format.outcome != 'success'
        run: exit 1
      - name: Compile and test PC-POWL2 contracts
        run: cargo test --all-features pc_powl2
      - name: Clippy
        run: cargo clippy --all-features --tests -- -D warnings
