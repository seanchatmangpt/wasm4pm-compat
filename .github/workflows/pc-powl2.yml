name: PC-POWL2 Wire

on:
  pull_request:
    branches: [main]
    paths:
      - "src/pc_powl2.rs"
      - "src/prelude.rs"
      - "src/dfcm.rs"
      - ".github/workflows/pc-powl2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pc-powl2-wire-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-clippy-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pc-powl2-wire
      - name: Apply exact derivable Default repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/dfcm.rs")
          source = path.read_text()
          old_derive = "#[derive(Debug, Clone, Copy, PartialEq, Eq, PartialOrd, Ord, Hash, Serialize, Deserialize)]\npub enum Standing {\n    Unknown,"
          new_derive = "#[derive(\n    Debug, Clone, Copy, Default, PartialEq, Eq, PartialOrd, Ord, Hash, Serialize, Deserialize,\n)]\npub enum Standing {\n    #[default]\n    Unknown,"
          old_impl = "\nimpl Default for Standing {\n    fn default() -> Self {\n        Standing::Unknown\n    }\n}\n"
          if source.count(old_derive) != 1 or source.count(old_impl) != 1:
              raise SystemExit("dfcm Default repair context mismatch")
          path.write_text(source.replace(old_derive, new_derive).replace(old_impl, "\n"))
          PY
          git diff --check -- src/dfcm.rs
      - name: Commit exact clippy repair
        run: |
          git config user.name "pc-powl2-receipt-broker"
          git config user.email "actions@users.noreply.github.com"
          git add src/dfcm.rs
          git diff --cached --quiet && exit 0
          git commit -m "Derive Default for DfCM standing"
          git push origin HEAD:agent/pc-powl2-wire
