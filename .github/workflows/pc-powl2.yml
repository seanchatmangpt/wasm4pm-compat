name: PC-POWL2 Wire

on:
  pull_request:
    branches: [main]
    paths:
      - "src/pc_powl2.rs"
      - "src/prelude.rs"
      - "src/dfcm.rs"
      - ".github/workflows/pc-powl2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pc-powl2-wire-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pc-powl2-wire
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-22
          components: rustfmt, clippy
      - name: Normalize owned PC-POWL2 files
        run: rustfmt --edition 2021 src/pc_powl2.rs src/prelude.rs src/dfcm.rs
      - name: Compile and test PC-POWL2 contracts
        run: cargo test --all-features pc_powl2
      - name: Clippy
        run: cargo clippy --all-features --tests -- -D warnings
      - name: Commit normalized DfCM repair
        run: |
          git config user.name "pc-powl2-receipt-broker"
          git config user.email "actions@users.noreply.github.com"
          git add src/dfcm.rs
          git diff --cached --quiet && exit 0
          git commit -m "Normalize derived DfCM standing default"
          git push origin HEAD:agent/pc-powl2-wire
