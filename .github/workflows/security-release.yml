name: Security Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: security-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Compile all features
        run: cargo check --all-targets --all-features
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --all-features --all-targets
      - name: Package dry run
        run: cargo package --allow-dirty

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve fixed quick-xml line
        run: cargo update -p quick-xml --precise 0.41.0
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependency graph
        run: cargo audit
