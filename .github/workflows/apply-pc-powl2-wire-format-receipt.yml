name: Apply PC-POWL2 Wire Format Receipt

on:
  push:
    branches:
      - agent/pc-powl2-wire
    paths:
      - ".github/workflows/apply-pc-powl2-wire-format-receipt.yml"

permissions:
  actions: read
  contents: write

concurrency:
  group: apply-pc-powl2-wire-format-receipt
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pc-powl2-wire
      - name: Download admitted formatting receipt
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: seanchatmangpt/wasm4pm-compat
          run-id: 29964469451
          name: pc-powl2-wire-formatted-sources
          path: /tmp/pc-powl2-wire-formatted
      - name: Admit exact normalized sources
        run: |
          echo "5c7fef8af3c9b3eca45fcdcf9f02b272a2e5cf5694f7571bd8e84c5aa509256b  /tmp/pc-powl2-wire-formatted/pc_powl2.rs" | sha256sum --check
          echo "cbe1d25df752bc13feb13a47e735a789f982b9c562c4980738ee87b1c001147a  /tmp/pc-powl2-wire-formatted/prelude.rs" | sha256sum --check
          install -m 0644 /tmp/pc-powl2-wire-formatted/pc_powl2.rs src/pc_powl2.rs
          install -m 0644 /tmp/pc-powl2-wire-formatted/prelude.rs src/prelude.rs
          git diff --check
      - name: Commit exact formatting receipt
        run: |
          git config user.name "pc-powl2-receipt-broker"
          git config user.email "actions@users.noreply.github.com"
          git add src/pc_powl2.rs src/prelude.rs
          git diff --cached --quiet && exit 0
          git commit -m "Apply PC-POWL2 wire formatting receipt"
          git push origin HEAD:agent/pc-powl2-wire
