name: Repair Rustfmt

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-rustfmt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: nightly-2026-06-22
  CARGO_TERM_COLOR: always

jobs:
  repair:
    name: repair/rustfmt
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt
          rustup override set "${RUST_TOOLCHAIN}"
          rustfmt --version
      - name: Manufacture formatter-only repair
        id: repair
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          set -euo pipefail

          allowed="${RUNNER_TEMP}/rustfmt-allowed.txt"
          : > "${allowed}"

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            # A PR repair may only mutate Rust files already owned by that PR.
            # This prevents pre-existing repository-wide rustfmt drift from
            # hitchhiking into an unrelated feature branch.
            git diff --name-only --diff-filter=ACMR "${BASE_SHA}...HEAD" -- '*.rs' > "${allowed}"
          fi

          cargo fmt --all
          git diff --check

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            while IFS= read -r path; do
              [[ -z "${path}" ]] && continue
              if ! grep -Fxq -- "${path}" "${allowed}"; then
                git restore --worktree -- "${path}"
              fi
            done < <(git diff --name-only -- '*.rs')
          fi

          changed="$(git diff --name-only)"
          if [[ -z "${changed}" ]]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          refused="$(printf '%s\n' "${changed}" | grep -Ev '\.rs$' || true)"
          if [[ -n "${refused}" ]]; then
            printf 'RUSTFMT_NON_RUST_MUTATION_REFUSED\n%s\n' "${refused}" >&2
            exit 65
          fi

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            outside_scope="$(printf '%s\n' "${changed}" | while IFS= read -r path; do
              [[ -z "${path}" ]] && continue
              grep -Fxq -- "${path}" "${allowed}" || printf '%s\n' "${path}"
            done)"
            if [[ -n "${outside_scope}" ]]; then
              printf 'RUSTFMT_OUTSIDE_PR_SCOPE_REFUSED\n%s\n' "${outside_scope}" >&2
              exit 66
            fi
          fi

          printf '%s\n' "${changed}"
          echo "changed=true" >> "${GITHUB_OUTPUT}"
      - name: Commit exact formatter output
        if: steps.repair.outputs.changed == 'true' && github.event_name == 'pull_request'
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "style: apply pinned nightly rustfmt"
          git push origin "HEAD:${HEAD_REF}"
