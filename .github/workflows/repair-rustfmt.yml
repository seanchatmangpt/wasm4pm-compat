name: Repair Rustfmt

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-rustfmt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: nightly-2026-06-22
  CARGO_TERM_COLOR: always

jobs:
  repair:
    name: repair/rustfmt
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt
          rustup override set "${RUST_TOOLCHAIN}"
          rustfmt --version
      - name: Manufacture formatter-only repair
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check

          changed="$(git diff --name-only)"
          if [[ -z "${changed}" ]]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          refused="$(printf '%s\n' "${changed}" | grep -Ev '\.rs$' || true)"
          if [[ -n "${refused}" ]]; then
            printf 'RUSTFMT_NON_RUST_MUTATION_REFUSED\n%s\n' "${refused}" >&2
            exit 65
          fi

          printf '%s\n' "${changed}"
          echo "changed=true" >> "${GITHUB_OUTPUT}"
      - name: Commit exact formatter output
        if: steps.repair.outputs.changed == 'true' && github.event_name == 'pull_request'
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "style: apply pinned nightly rustfmt"
          git push origin "HEAD:${HEAD_REF}"
