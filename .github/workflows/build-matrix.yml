name: Build Matrix

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-matrix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: nightly-2026-06-22
  CARGO_TERM_COLOR: always

jobs:
  build-contract:
    name: build/basic-surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup override set "${RUST_TOOLCHAIN}"
      - name: Execute complete basic build contract
        shell: bash
        run: ./scripts/build-matrix.sh
