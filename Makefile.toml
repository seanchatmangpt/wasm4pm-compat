[config]
default_to_workspace = false

# ---------------------------------------------------------------------------
# Core dev loop
# ---------------------------------------------------------------------------

[tasks.check]
description = "Fast type check — default profile (formats feature on)"
command = "cargo"
args = ["check"]

[tasks.check-all]
description = "Type check all features"
command = "cargo"
args = ["check", "--all-features"]

[tasks.build]
description = "Build — default profile"
command = "cargo"
args = ["build"]

[tasks.build-all]
description = "Build — all features"
command = "cargo"
args = ["build", "--all-features"]

[tasks.test]
description = "Run unit + integration tests — default profile"
command = "cargo"
args = ["test", "--tests"]

[tasks.test-all]
description = "Run unit + integration tests — all features"
command = "cargo"
args = ["test", "--all-features", "--tests"]

[tasks.test-minimal]
description = "Run tests — base profile only (no Cargo features)"
command = "cargo"
args = ["test", "--no-default-features", "--tests"]

# ---------------------------------------------------------------------------
# Explicit opt-in surfaces (not part of daily dev loop)
# ---------------------------------------------------------------------------

[tasks.alive]
description = "ALIVE gate — type-law receipt tests (trybuild compile-fail/pass fixtures)"
command = "cargo"
args = ["test", "--test", "ui_tests", "--", "--ignored"]

[tasks.doc-test]
description = "Documentation audit — explicit opt-in (slow on nightly)"
command = "cargo"
args = ["test", "--doc", "--all-features"]

[tasks.doc]
description = "Build documentation — all features"
command = "cargo"
args = ["doc", "--all-features", "--no-deps"]

# ---------------------------------------------------------------------------
# Lint and format
# ---------------------------------------------------------------------------

[tasks.clippy]
description = "Clippy — all features, deny warnings"
command = "cargo"
args = ["clippy", "--all-features", "--", "-D", "warnings"]

[tasks.fmt]
description = "Check formatting"
command = "cargo"
args = ["fmt", "--check"]

[tasks.fmt-fix]
description = "Apply formatting"
command = "cargo"
args = ["fmt"]

# ---------------------------------------------------------------------------
# Feature-specific builds (for CI verification)
# ---------------------------------------------------------------------------

[tasks.build-formats]
description = "Build — formats feature only"
command = "cargo"
args = ["build", "--no-default-features", "--features", "formats"]

[tasks.build-strict]
description = "Build — strict feature only"
command = "cargo"
args = ["build", "--no-default-features", "--features", "strict"]

[tasks.build-wasm4pm]
description = "Build — wasm4pm feature only"
command = "cargo"
args = ["build", "--no-default-features", "--features", "wasm4pm"]

# ---------------------------------------------------------------------------
# ggen provision
#
# RESOLVED (2026-08-24): the installed ggen CLI (v26.8.18) has no
# --manifest and no --rule flag, no per-rule selection at all (`ggen sync
# run` renders EVERY [[generation.rules]] entry in the resolved ggen.toml
# on every invocation), and resolves ggen.toml from its cwd only -- AND
# (discovered this same turn) rejects any absolute `output_dir` /
# `output_file` combo ([FM-WRITE-002] "path must be relative"). ggen/ggen.toml
# used to set output_dir to an absolute repo path and assume cwd=ggen/ for
# every relative query/template/ontology path -- both now incompatible with
# the installed CLI. Fixed by rewriting every relative path in ggen/ggen.toml
# to be repo-root-relative (ggen/ontology/..., ggen/queries/..., etc.) and
# output_dir = "." (repo-root-relative, since ggen.toml must run from repo
# root's own view once copied there). Since ggen resolves "ggen.toml" from
# cwd only and there's no manifest-path flag, these tasks stage a temporary
# copy at repo root, run, then remove it -- the same proven workaround this
# session used throughout (see ~/.claude/skills/run-ggen/SKILL.md). The 5
# sibling-~/wasm4pm-repo output_file values remain absolute by design --
# those are real, intentional cross-repo output, untouched by this fix.
# ---------------------------------------------------------------------------

[tasks.ggen-sync]
description = "Regenerate ALL ggen-driven artifacts (witnesses x7, audit scripts, breed files) -- runs every rule in ggen/ggen.toml, per-rule selection is not supported by the installed CLI"
command = "bash"
args = ["-c", "cp ggen/ggen.toml ggen.toml && ggen sync run; rc=$?; rm -f ggen.toml; exit $rc"]

[tasks.ggen-sync-dry]
description = "Dry run — preview the full ggen sync without writing"
command = "bash"
args = ["-c", "cp ggen/ggen.toml ggen.toml && ggen sync run --dry-run; rc=$?; rm -f ggen.toml; exit $rc"]

# ---------------------------------------------------------------------------
# CI aggregate
# ---------------------------------------------------------------------------

[tasks.ci]
description = "Full CI: check-all, test-all, clippy, fmt, alive"
dependencies = ["check-all", "test-all", "clippy", "fmt", "alive"]

# ── Verification bridge: MIRI ────────────────────────────────────────────────
# Proves no undefined behavior across the transitive dependency graph and in
# const-eval — the surface #![forbid(unsafe_code)] does NOT cover (blake3,
# hashbrown, quick-xml, uuid, rustc-hash all carry internal unsafe).
# NOT yet wired into `ci`: run it once, resolve/flag findings, then add.

[tasks.miri-setup]
description = "Install the MIRI component on the pinned nightly"
command = "rustup"
args = ["component", "add", "miri"]

[tasks.miri]
description = "Run tests under MIRI (no-UB proof across the dep graph)"
dependencies = ["miri-setup"]
command = "cargo"
args = ["miri", "test", "--tests"]
# uuid v4 / chrono touch the clock + RNG; MIRI needs isolation relaxed for those.
[tasks.miri.env]
MIRIFLAGS = "-Zmiri-disable-isolation"
