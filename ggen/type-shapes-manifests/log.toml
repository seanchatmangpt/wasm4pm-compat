[project]
name = "wasm4pm-compat-type-shapes-log"
version = "26.8.7"
description = "ggen projection of the log SHACL type-shape ontology into Rust"
authors = ["Sean Chatman"]
license = "MIT OR Apache-2.0"

[ontology]
source = "ggen/ontology/type-shapes/log.ttl"
standard_only = false

[generation]
output_dir = "."

[[generation.rules]]
name = "rust-types-log"
query = { file = "ggen/queries/extract-type-shapes.rq" }
template = { file = "ggen/templates/rust-types.rs.tera" }
output_file = "src/log_ontology.rs"
mode = "Overwrite"
