[project]
name = "wasm4pm-compat-type-shapes-transition_system"
version = "26.8.7"
description = "ggen projection of the transition_system SHACL type-shape ontology into Rust"
authors = ["Sean Chatman"]
license = "MIT OR Apache-2.0"

[ontology]
source = "ggen/ontology/type-shapes/transition_system.ttl"
standard_only = false

[generation]
output_dir = "."

[[generation.rules]]
name = "rust-types-transition_system"
query = { file = "ggen/queries/extract-type-shapes.rq" }
template = { file = "ggen/templates/rust-types.rs.tera" }
output_file = "src/transition_system_ontology.rs"
mode = "Overwrite"
