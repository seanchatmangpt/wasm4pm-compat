# wasm4pm-compat ggen 26.7.62 consumer tasks.
# Invoke from the repository root with:
#   cargo make --makefile ggen/Makefile.toml <task>

[config]
default_to_workspace = false

[tasks.ggen-audit]
description = "Audit every active ggen authority, command, template, and output fence"
command = "python3"
args = ["scripts/audit-ggen-usage.py", "--output", "target/ggen-standing/usage-audit.json"]

[tasks.ggen-validate]
description = "Validate the root graph, local pack, frontmatter, SPARQL, and law gates"
command = "ggen"
args = ["graph", "validate"]
dependencies = ["ggen-audit"]

[tasks.ggen-doctor]
description = "Diagnose pack-lock, receipt, and consumer configuration standing"
command = "ggen"
args = ["doctor", "run"]
dependencies = ["ggen-validate"]

[tasks.ggen-dry-run]
description = "Resolve and render the complete pack without filesystem actuation"
command = "ggen"
args = ["sync", "run", "--dry-run"]
dependencies = ["ggen-doctor"]

[tasks.ggen-sync]
description = "Manufacture every pack-owned first-class projection and emit a receipt"
command = "ggen"
args = ["sync", "run"]
dependencies = ["ggen-doctor"]

[tasks.ggen-receipt]
description = "Verify the latest cryptographic ggen receipt"
command = "ggen"
args = ["receipt", "verify"]
dependencies = ["ggen-sync"]

[tasks.ggen-replay]
description = "Run the complete audit, sync, receipt, and byte-stability replay rail"
command = "bash"
args = ["scripts/verify-ggen-contract.sh"]

[tasks.substrate-status]
description = "Show active consumer, pack, templates, gates, lock, and receipt surfaces"
script_runner = "@shell"
script = '''
#!/usr/bin/env bash
set -euo pipefail

echo "=== wasm4pm-compat ggen 26.7.62 status ==="
printf 'consumer manifest: '; test -f ggen.toml && echo ggen.toml || echo MISSING
printf 'local pack:        '; test -f packs/wasm4pm-compat-pack/pack.toml && echo present || echo MISSING
printf 'pack templates:    '; find packs/wasm4pm-compat-pack/templates -maxdepth 1 -name '*.tmpl' -type f | wc -l | tr -d ' '
echo
printf 'law gates:         '; find ggen/gates -maxdepth 1 -name '*.rq' -type f | wc -l | tr -d ' '
echo
printf 'pack lock:         '; test -f ggen.lock && echo ggen.lock || echo 'not emitted yet'
printf 'latest receipt:    '; test -f .ggen-v2/receipt.json && echo .ggen-v2/receipt.json || echo 'not emitted yet'
printf 'receipt log:       '; test -f .ggen-v2/receipt-log.jsonl && echo .ggen-v2/receipt-log.jsonl || echo 'not emitted yet'
python3 scripts/audit-ggen-usage.py >/dev/null
echo 'usage audit:       PASS'
'''
